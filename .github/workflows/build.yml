name: Test and package Windows + Linux
on:
  push:
    branches: [main, 'codex/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Unit tests with mocked hardware
        run: python -m unittest discover -s tests -v
        env:
          VOLTGUARD_DEMO: '1'
      - name: Render GUI on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a python main.py --smoke-test
        env:
          PYSTRAY_BACKEND: dummy
      - name: Render GUI on Windows
        if: runner.os == 'Windows'
        run: python main.py --smoke-test
      - name: Build Windows executable
        if: runner.os == 'Windows'
        run: |
          python -m pip install 'pyinstaller>=6.16,<7'
          python -m PyInstaller --noconfirm VoltGuard.spec
      - name: Test packaged Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $app = Start-Process -FilePath .\dist\VoltGuard.exe -ArgumentList '--smoke-test' -PassThru -Wait
          if ($app.ExitCode -ne 0) { throw "Packaged GUI smoke test failed: $($app.ExitCode)" }
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' VoltGuard.iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup failed' }
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: VoltGuard-1.3.0-Windows
          path: Release/VoltGuard_1.3.0_Windows_Setup.exe
      - name: Build Linux distribution
        if: runner.os == 'Linux'
        run: |
          mkdir -p artifacts/VoltGuard-1.3.0-Linux
          cp main.py requirements.txt logo.png logo.ico README.md artifacts/VoltGuard-1.3.0-Linux/
          cp -r src scripts artifacts/VoltGuard-1.3.0-Linux/
          tar --exclude=__pycache__ -C artifacts -czf artifacts/VoltGuard-1.3.0-Linux.tar.gz VoltGuard-1.3.0-Linux
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: VoltGuard-1.3.0-Linux
          path: artifacts/VoltGuard-1.3.0-Linux.tar.gz
  release:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish validated distributions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag="v1.3.0"
          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; validated build artifacts remain attached to this run."
          else
            gh release create "$release_tag" release-assets/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "VoltGuard $release_tag · Windows + Linux" --generate-notes
          fi
